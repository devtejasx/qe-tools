name: Close stale dependency PRs

on:
  schedule:
    # daily, outside the busy part of the day for the bots that open these
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: stale
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          # Only dependency PRs, which are all bot-authored. Issues and every
          # human-authored PR are left alone.
          only-pr-labels: dependencies
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 60
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This dependency update has had no activity for 60 days. It will be
            closed in 7 days unless it is updated or the `stale` label is
            removed. The bot that opened it will raise a fresh one against the
            current dependency tree if the update is still wanted.
          close-pr-message: >
            Closing this dependency update after 67 days without activity. This
            is not a judgement on the update itself -- reopen it, or let the bot
            raise a current one, if it is still wanted.
          # Enough to work through the existing backlog in a single run.
          operations-per-run: 300
          ascending: true
